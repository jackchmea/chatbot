<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor y Pizarrón</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <!-- =========================
             SECCIÓN 1 - CONVERSOR
        ========================== -->

        <section class="conversor">

            <h1>1. CONVERTIDOR DE MONEDA</h1>

            <!-- Pesos a dólares y euros -->
            <div class="caja-conversor">

                <h2>De pesos a dólares / euros</h2>

                <div class="fila">

                    <div class="campo">
                        <label for="pesos">Pesos (ARS)</label>
                        <input
                            type="number"
                            id="pesos"
                            placeholder="Ingrese pesos"
                        >
                    </div>

                    <span class="flecha">→</span>

                    <div class="campo">
                        <label for="dolaresResultado">
                            Dólares (USD)
                        </label>

                        <input
                            type="text"
                            id="dolaresResultado"
                            readonly
                        >
                    </div>

                </div>


                <div class="fila">

                    <div class="campo">
                        <label for="pesosIngresados">
                            Pesos (ARS)
                        </label>

                        <input
                            type="text"
                            id="pesosIngresados"
                            readonly
                        >
                    </div>

                    <span class="flecha">→</span>

                    <div class="campo">
                        <label for="eurosResultado">
                            Euros (EUR)
                        </label>

                        <input
                            type="text"
                            id="eurosResultado"
                            readonly
                        >
                    </div>

                </div>

            </div>


            <!-- Dólares y euros a pesos -->
            <div class="caja-conversor">

                <h2>De dólares / euros a pesos</h2>

                <div class="fila">

                    <div class="campo">
                        <label for="dolares">
                            Dólares (USD)
                        </label>

                        <input
                            type="number"
                            id="dolares"
                            placeholder="Ingrese dólares"
                        >
                    </div>

                    <span class="flecha">→</span>

                    <div class="campo">
                        <label for="pesosDesdeDolar">
                            Pesos (ARS)
                        </label>

                        <input
                            type="text"
                            id="pesosDesdeDolar"
                            readonly
                        >
                    </div>

                </div>


                <div class="fila">

                    <div class="campo">
                        <label for="euros">
                            Euros (EUR)
                        </label>

                        <input
                            type="number"
                            id="euros"
                            placeholder="Ingrese euros"
                        >
                    </div>

                    <span class="flecha">→</span>

                    <div class="campo">
                        <label for="pesosDesdeEuro">
                            Pesos (ARS)
                        </label>

                        <input
                            type="text"
                            id="pesosDesdeEuro"
                            readonly
                        >
                    </div>

                </div>

            </div>


            <!-- Tasas -->
            <div class="tasas">

                <p><strong>Tasas de cambio aproximadas:</strong></p>

                <p>
                    1 USD ≈ $1530 ARS
                    &nbsp; | &nbsp;
                    1 EUR ≈ $1780 ARS
                </p>

                <small>
                    * Las tasas pueden variar.
                </small>

            </div>

        </section>


        <!-- =========================
             SECCIÓN 2 - PIZARRÓN
        ========================== -->

        <section class="pizarron">

            <h1>2. PIZARRÓN DE ANOTACIONES</h1>

            <div class="tablero">

                <h2>MIS ANOTACIONES</h2>

                <div id="listaNotas">

                    <div class="nota">

                        <span>Recordar reunión el lunes</span>

                        <button onclick="eliminarNota(this)">
                            ×
                        </button>

                    </div>


                    <div class="nota">

                        <span>Estudiar para el examen</span>

                        <button onclick="eliminarNota(this)">
                            ×
                        </button>

                    </div>

                </div>

            </div>


            <button
                class="boton-agregar"
                onclick="agregarNota()"
            >
                <span>＋</span>
                AGREGAR NOTA PERSONALIZADA
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
